{{- if .Values.bucketClass.create }}
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClass
metadata:
  name: {{ .Values.bucketClass.name }}
  labels:
    {{- include "cosi-driver-h3.labels" . | nindent 4 }}
spec:
  driverName: s3.h3llo.cloud
  deletionPolicy: {{ .Values.bucketClass.deletionPolicy }}
{{- end }}
{{- if .Values.bucketAccessClass.create }}
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccessClass
metadata:
  name: {{ .Values.bucketAccessClass.name }}
  labels:
    {{- include "cosi-driver-h3.labels" . | nindent 4 }}
spec:
  driverName: s3.h3llo.cloud
  authenticationType: {{ .Values.bucketAccessClass.authenticationType }}
{{- end }}
