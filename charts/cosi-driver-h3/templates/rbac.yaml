apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cosi-driver-h3.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cosi-driver-h3.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cosi-driver-h3.fullname" . }}
  labels:
    {{- include "cosi-driver-h3.labels" . | nindent 4 }}
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets", "bucketaccesses", "bucketclaims", "bucketaccessclasses", "bucketclasses"]
    verbs: ["get", "list", "watch", "update", "create", "delete"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets/status", "bucketaccesses/status", "bucketclaims/status"]
    verbs: ["get", "update", "patch"]
  # Sidecar caches/creates the credential Secrets; needs list+watch cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cosi-driver-h3.fullname" . }}
  labels:
    {{- include "cosi-driver-h3.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cosi-driver-h3.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cosi-driver-h3.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
