{{- if not .Values.credentials.existingSecret }}
{{- if not .Values.credentials.keyId }}{{ fail "credentials.keyId is required (or set credentials.existingSecret)" }}{{- end }}
{{- if not .Values.credentials.secretKey }}{{ fail "credentials.secretKey is required (or set credentials.existingSecret)" }}{{- end }}
{{- if not .Values.h3.projectId }}{{ fail "h3.projectId is required" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cosi-driver-h3.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cosi-driver-h3.labels" . | nindent 4 }}
type: Opaque
stringData:
  H3_KEY_ID: {{ .Values.credentials.keyId | quote }}
  H3_SECRET_KEY: {{ .Values.credentials.secretKey | quote }}
  H3LLO_PROJECT_ID: {{ .Values.h3.projectId | quote }}
{{- end }}
