# Example COSI usage (API v1alpha2).
# Assumes the BucketClass (h3llo-standard) and BucketAccessClass (h3llo-key)
# already exist — the Helm chart creates them by default.
---
# Request a bucket.
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClaim
metadata:
  name: my-bucket
  namespace: default
spec:
  bucketClassName: h3llo-standard
  protocols: ["S3"]
---
# Request credentials. Per-claim credentials land in the named Secret.
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: my-bucket-access
  namespace: default
spec:
  bucketAccessClassName: h3llo-key
  protocol: S3
  bucketClaims:
    - bucketClaimName: my-bucket
      accessMode: ReadWrite
      accessSecretName: my-bucket-creds
